<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>m2api-client: API testing workspace for React</title>
    <meta
      name="description"
      content="Drop a Postman-style API testing workspace into your React app: request builder, response inspector, auth, environments, collections, history and cURL."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4' fill='%231a1522'/%3E%3Cpath d='M5.5 6.5L9 10l-3.5 3.5M10.5 13.5h4' fill='none' stroke='%23eef17c' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // A visitor's own choice (the theme toggle) wins; otherwise follow the system.
      try {
        var choice = localStorage.getItem('m2api-site:theme');
        document.documentElement.dataset.theme =
          choice === 'light' || choice === 'dark' ? choice : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
